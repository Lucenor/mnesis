name: Benchmark
permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - "benchmarks/**"
      - "src/**"
      - "pyproject.toml"
  pull_request:
    branches: [main]
    paths:
      - "benchmarks/**"
      - "src/**"
      - "pyproject.toml"

jobs:
  benchmark-smoke:
    name: Benchmark Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --dev

      - name: LOCOMO dry-run (metrics only, no API key needed)
        env:
          MNESIS_MOCK_LLM: "1"
        run: |
          uv run python benchmarks/locomo.py --generate-baseline --metrics-only --conversations 1
          uv run python benchmarks/locomo.py --metrics-only --conversations 1
